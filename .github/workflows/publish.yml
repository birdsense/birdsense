name: Publish images

# Builds and pushes the bridge and web images to GHCR for a release tag.
#
# - Called from ci.yml right after semantic-release created a new tag.
#   (A release created with GITHUB_TOKEN does not trigger other workflows,
#   so an `on: release` trigger would never fire.)
# - Can be run by hand to (re)publish an existing tag, e.g. v1.0.3.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.0.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.0.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.component }} ${{ inputs.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [bridge, web]
    steps:
      - name: Validate tag
        run: |
          if ! [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${{ inputs.tag }}' is not a vX.Y.Z tag"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/birdsense-${{ matrix.component }}
          # v1.2.3 -> 1.2.3, 1.2, 1, latest
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=birdsense-${{ matrix.component }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
