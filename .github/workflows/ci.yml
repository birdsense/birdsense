name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          pip install -r requirements-dev.txt

      # Installs the pinned web deps and the bridge deps without the heavy ML
      # stack (torch etc. is validated by the Docker Build job below).
      - name: Install app dependencies (for linting)
        run: |
          pip install -r web/requirements.txt
          grep -viE '^(torch|torchvision|transformers|birder)\b' bridge/requirements.txt > /tmp/bridge-light.txt
          pip install -r /tmp/bridge-light.txt

      - name: Run Ruff (fast linter)
        run: |
          ruff check bridge/ web/ tests/ --output-format=github

      - name: Check formatting
        run: |
          ruff format --check bridge/ web/ tests/

      - name: Run Pylint on bridge
        run: |
          pylint bridge/*.py --exit-zero --output-format=colorized

      - name: Run Pylint on web
        run: |
          pylint web/*.py --exit-zero --output-format=colorized

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # torch/birder are not needed: the tests stub out the classifier
        run: |
          pip install -r requirements-dev.txt -r web/requirements.txt flasgger paho-mqtt python-dotenv

      - name: Run pytest
        run: |
          pytest -q

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bridge image
        uses: docker/build-push-action@v5
        with:
          context: ./bridge
          push: false
          tags: birdsense-bridge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: false
          tags: birdsense-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install safety
        run: pip install safety

      - name: Check bridge dependencies
        run: safety check -r bridge/requirements.txt --output text || true

      - name: Check web dependencies
        run: safety check -r web/requirements.txt --output text || true
